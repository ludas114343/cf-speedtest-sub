name: Cloudflare Multi-Region Speed Test

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speedtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process and Validate Multi-Region Nodes
        run: |
          python process_results.py

      - name: Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add addressesapi.txt README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update preferred multi-region nodes for EdgeTunnel ADDAPI [skip ci]" && git pull --rebase origin main && git push origin main)
