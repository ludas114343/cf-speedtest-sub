name: Cloudflare Multi-Region Speed Test

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  speedtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download & Install CloudflareSpeedTest
        run: |
          CFST_VERSION="v2.3.4"
          wget -q https://github.com/XIU2/CloudflareSpeedTest/releases/download/${CFST_VERSION}/cfst_linux_amd64.tar.gz
          tar -zxf cfst_linux_amd64.tar.gz
          chmod +x cfst

      - name: Prepare Test IPs
        run: |
          cat ip.txt > test_ips.txt
          if [ -f special_colos.txt ]; then
            grep -v '^#' special_colos.txt | grep -v '^$' >> test_ips.txt
          fi

      - name: Execute Multi-Region Speed Test
        run: |
          # Target Colos: Macau, Switzerland, Luxembourg, France, Germany, Netherlands, Ireland, UK, Spain, Italy, Austria, Belgium, Sweden, Poland, Czech, Portugal, Australia, New Zealand, Canada, Korea, Japan, US (Strictly NO HKG, NO SIN)
          COLOS="MFM,LUX,ZRH,GVA,CDG,MRS,FRA,AMS,DUB,LHR,MAD,MXP,VIE,BRU,ARN,WAW,PRG,LIS,SYD,MEL,AKL,YYZ,YVR,ICN,NRT,KIX,LAX,SJC,IAD"
          echo "Starting CloudflareST across European & Special Colos: $COLOS"
          ./cfst -f test_ips.txt -httping -cfcolo "$COLOS" -tl 350 -tlr 0.2 -dn 30 -dt 5 -p 0 -o result.csv || true

      - name: Process & Filter Top Regional Nodes
        run: |
          python process_results.py

      - name: Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add addressesapi.txt clash.yaml README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update preferred multi-region nodes and clash config [skip ci]" && git push)
